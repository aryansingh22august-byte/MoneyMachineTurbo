name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.pre-commit-config.yaml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.pre-commit-config.yaml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  PNPM_VERSION: '10'

jobs:
  lint-and-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v4.0.4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm exec eslint . --ext .ts,.tsx

      - name: Run Prettier
        run: pnpm exec prettier --check .

      - name: Type-check TypeScript
        run: pnpm run check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v4.0.4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  python-lint-and-test:
    name: Python Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server/ml
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@8d9f87161a7b4b5b8e5b8b5e5b8b5e5b8b5e5b8b5  # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff mypy pip-audit

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run mypy (type-check)
        run: mypy . --ignore-missing-imports

      - name: Run pytest
        run: pytest -v

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --desc on
        continue-on-error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, python-lint-and-test]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v4.0.4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm exec vite build

      - name: Build backend
        run: pnpm exec esbuild server/_core/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/index.js

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2a0418c5a8c5b5e5b8b5  # v3.5.1

      - name: Build Node.js image
        uses: docker/build-push-action@471d1dc4e0e21c8e5e5b8b5e5b8b5e5b8b5e5b8b  # v5.3.0
        with:
          context: .
          file: Dockerfile.node
          load: true
          tags: moneymachineturbo/app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Python ML image
        uses: docker/build-push-action@471d1dc4e0e21c8e5e5b8b5e5b8b5e5b8b5e5b8b  # v5.3.0
        with:
          context: ./server/ml
          file: Dockerfile
          load: true
          tags: moneymachineturbo/ml:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda  # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v4.0.4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=high
        continue-on-error: false

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit -r ./server/ml/requirements.txt --desc on
        continue-on-error: false

      - name: Run Trivy scanner (filesystem)
        uses: aquasecurity/trivy-action@028cd2b4e8b5e5b8b5e5b8b5e5b8b5e5b8b5e5b  # v0.23.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Run Trivy scanner (Docker images)
        uses: aquasecurity/trivy-action@028cd2b4e8b5e5b8b5e5b8b5e5b8b5e5b8b5e5b  # v0.23.0
        with:
          scan-type: 'image'
          scan-ref: 'moneymachineturbo/app:test'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Upload Trivy FS results
        uses: github/codeql-action/upload-sarif@c8b5e5b8b5e5b8b5e5b8b5e5b8b5e5b8b5e5b8b  # v3.27.1
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy Docker results
        uses: github/codeql-action/upload-sarif@c8b5e5b8b5e5b8b5e5b8b5e5b8b5e5b8b5e5b8b  # v3.27.1
        with:
          sarif_file: 'trivy-docker-results.sarif'

      - name: Verify action pins
        run: |
          echo "Checking for unpinned actions..."
          grep -r "uses: " .github/workflows/ | grep -v "@[a-f0-9]\{40\}" && echo "❌ Unpinned actions found!" && exit 1 || echo "✅ All actions pinned to SHA"