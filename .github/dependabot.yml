# Dependabot Configuration
# Automated dependency updates for security and maintenance

version: 2
updates:
  # Node.js dependencies (pnpm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    pull-request-branch-name:
      separator: "-"
    open-pull-requests-limit: 10
    reviewers:
      - "aryansingh22august-byte"
    assignees:
      - "aryansingh22august-byte"
    groups:
      dev-dependencies:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "vitest*"
          - "typescript*"
        update-types:
          - "minor"
          - "patch"
      react-ecosystem:
        patterns:
          - "react*"
          - "@radix-ui/*"
          - "@tanstack/*"
          - "tailwind*"
        update-types:
          - "minor"
          - "patch"

  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/server/ml"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    pull-request-branch-name:
      separator: "-"
    open-pull-requests-limit: 5
    reviewers:
      - "aryansingh22august-byte"
    assignees:
      - "aryansingh22august-byte"
    groups:
      ml-core:
        patterns:
          - "numpy"
          - "pandas"
          - "scikit-learn"
          - "scipy"
        update-types:
          - "minor"
          - "patch"
      ml-frameworks:
        patterns:
          - "lightgbm"
          - "xgboost"
          - "catboost"
        update-types:
          - "minor"
          - "patch"
      api:
        patterns:
          - "fastapi"
          - "pydantic"
          - "uvicorn"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 5

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Asia/Kolkata"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 3