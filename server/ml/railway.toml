# Railway configuration for the Python ML API service (beautiful-youthfulness)
# ⚠️  IMPORTANT: In the Railway dashboard, this service MUST have:
#     Root Directory = server/ml
#     This ensures Railway uses THIS Dockerfile, not the root Node.js one.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn ml_api:app --host 0.0.0.0 --port ${PORT:-5000}"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Required environment variables (set in Railway dashboard):
#   PORT = 5000
